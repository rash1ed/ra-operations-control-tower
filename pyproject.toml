[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-operations-control-tower"
version = "0.1.0"
description = "Deterministic operations control-tower CLI for KPI, RAG, overdue and RAID reporting."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ra-control-tower = "control_tower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"
